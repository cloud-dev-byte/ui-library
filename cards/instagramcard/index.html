<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Instagram Profile Card</title>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="../../style.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      main {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

        padding: 20px;

        font-family: "DM Sans", sans-serif;

        background:
          radial-gradient(
            circle at 15% 20%,
            rgba(255, 196, 87, 0.8),
            transparent 28%
          ),
          radial-gradient(
            circle at 85% 20%,
            rgba(225, 48, 108, 0.8),
            transparent 30%
          ),
          radial-gradient(
            circle at 80% 90%,
            rgba(131, 58, 180, 0.9),
            transparent 32%
          ),
          radial-gradient(
            circle at 20% 90%,
            rgba(64, 93, 230, 0.8),
            transparent 30%
          ),
          linear-gradient(135deg, #405de6, #833ab4 35%, #e1306c 65%, #f77737);

        overflow: hidden;
      }

      /* Ambient glow */
      body::before,
      body::after {
        content: "";
        position: fixed;

        width: 380px;
        height: 380px;

        border-radius: 50%;
        filter: blur(90px);

        opacity: 0.35;
        pointer-events: none;
      }

      body::before {
        background: #ffdc80;
        top: -180px;
        left: -150px;
      }

      body::after {
        background: #833ab4;
        bottom: -180px;
        right: -150px;
      }

      /* Card */
      .card {
        position: relative;

        width: 390px;
        padding: 34px 32px 30px;

        border: 1px solid rgba(255, 255, 255, 0.55);
        border-radius: 32px;

        background: rgba(255, 255, 255, 0.82);

        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);

        box-shadow:
          0 35px 90px rgba(28, 11, 50, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.8);

        overflow: hidden;
      }

      /* Decorative gradient blob */
      .card::before {
        content: "";

        position: absolute;

        width: 190px;
        height: 190px;

        top: -105px;
        right: -80px;

        border-radius: 50%;

        background: linear-gradient(135deg, #feda75, #fa7e1e, #d62976, #962fbf);

        filter: blur(10px);
        opacity: 0.28;
      }

      /* Top label */
      .top-label {
        position: relative;

        display: inline-flex;
        align-items: center;
        gap: 7px;

        margin-bottom: 24px;

        color: #777;

        font-size: 10px;
        font-weight: 700;

        letter-spacing: 1.6px;
        text-transform: uppercase;
      }

      .top-label span {
        width: 6px;
        height: 6px;

        border-radius: 50%;

        background: linear-gradient(135deg, #feda75, #d62976, #833ab4);
      }

      /* Avatar */
      .avatar-wrap {
        position: relative;

        width: 112px;
        height: 112px;

        margin: 0 auto 20px;
      }

      .avatar-ring {
        position: absolute;

        inset: -5px;

        border-radius: 50%;

        background: conic-gradient(
          #feda75,
          #fa7e1e,
          #d62976,
          #962fbf,
          #4f5bd5,
          #feda75
        );

        animation: rotate 8s linear infinite;
      }

      .avatar {
        position: relative;

        width: 100%;
        height: 100%;

        padding: 4px;

        border-radius: 50%;
        background: white;
      }

      .avatar img {
        width: 100%;
        height: 100%;

        display: block;

        object-fit: cover;

        border-radius: 50%;
      }

      @keyframes rotate {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }

      /* Name */
      .name {
        position: relative;

        color: #19171b;

        text-align: center;

        font-family: "Playfair Display", serif;
        font-size: 31px;
        line-height: 1.15;
        font-weight: 600;

        letter-spacing: -1px;
      }

      /* Verified badge */
      .verified {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        width: 17px;
        height: 17px;

        margin-left: 4px;

        border-radius: 50%;

        color: white;
        background: #0095f6;

        font-family: Arial, sans-serif;
        font-size: 9px;
        font-weight: bold;

        vertical-align: 5px;
      }

      /* Username */
      .username {
        position: relative;

        margin-top: 7px;

        color: #858188;

        text-align: center;

        font-size: 13px;
        font-weight: 500;
      }

      /* Bio */
      .bio {
        position: relative;

        max-width: 285px;

        margin: 18px auto 26px;

        color: #5e5a60;

        text-align: center;

        font-size: 13px;
        line-height: 1.7;
        font-weight: 400;
      }

      .bio em {
        color: #302c32;

        font-style: normal;
        font-weight: 600;
      }

      /* Stats */
      .stats {
        position: relative;

        display: grid;
        grid-template-columns: repeat(3, 1fr);

        padding: 19px 0;

        border-top: 1px solid rgba(0, 0, 0, 0.07);
        border-bottom: 1px solid rgba(0, 0, 0, 0.07);
      }

      .stat {
        text-align: center;
      }

      .stat + .stat {
        border-left: 1px solid rgba(0, 0, 0, 0.07);
      }

      .stat-number {
        color: #211e22;

        font-size: 18px;
        font-weight: 700;

        letter-spacing: -0.5px;
      }

      .stat-label {
        margin-top: 4px;

        color: #989399;

        font-size: 10px;
        font-weight: 600;

        text-transform: uppercase;
        letter-spacing: 0.8px;
      }

      /* Buttons */
      .actions {
        display: grid;
        grid-template-columns: 1.25fr 1fr;

        gap: 10px;

        margin-top: 22px;
      }

      button {
        height: 46px;

        border: 0;
        border-radius: 14px;

        font-family: inherit;

        font-size: 13px;
        font-weight: 700;

        cursor: pointer;

        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease;
      }

      .follow {
        color: white;

        background: linear-gradient(110deg, #833ab4, #d62976 55%, #f77737);

        box-shadow: 0 10px 25px rgba(214, 41, 118, 0.22);
      }

      .message {
        color: #373238;

        background: rgba(255, 255, 255, 0.72);

        border: 1px solid rgba(0, 0, 0, 0.07);
      }

      button:hover {
        transform: translateY(-3px);
      }

      .follow:hover {
        box-shadow: 0 14px 32px rgba(214, 41, 118, 0.32);
      }

      /* Footer */
      .footer {
        margin-top: 20px;

        color: #aaa6ab;

        text-align: center;

        font-size: 10px;
        font-weight: 500;

        letter-spacing: 0.4px;
      }

      /* Responsive */
      @media (max-width: 430px) {
        body {
          padding: 18px;
        }

        .card {
          width: 100%;
          padding: 28px 22px 24px;
        }

        .name {
          font-size: 28px;
        }
      }
    </style>
  </head>

  <body>
    <header class="site-header">
      <div class="header-container">
        <a href="./" class="logo-link">
          <div class="logo-box">U</div>
          <span class="logo-text">UI Library</span>
        </a>

        <a
          href="https://github.com/cloud-dev-byte/ui-vault.git"
          target="_blank"
          rel="noopener noreferrer"
          class="btn-github"
        >
          GitHub
        </a>
      </div>
    </header>

    <main>
      <div class="card">
        <div class="top-label">
          <span></span>
          Instagram Profile
        </div>

        <div class="avatar-wrap">
          <div class="avatar-ring"></div>

          <div class="avatar">
            <img src="https://i.pravatar.cc/300?img=12" alt="Profile picture" />
          </div>
        </div>

        <h1 class="name">
          Pixel & Code
          <span class="verified">✓</span>
        </h1>

        <p class="username">@_pixelcode</p>

        <p class="bio">
          Digital creator & lifestyle enthusiast ✨<br />
          Sharing <em>moments, stories & inspiration.</em>
        </p>

        <div class="stats">
          <div class="stat">
            <div class="stat-number">248</div>
            <div class="stat-label">Posts</div>
          </div>

          <div class="stat">
            <div class="stat-number">18.4K</div>
            <div class="stat-label">Followers</div>
          </div>

          <div class="stat">
            <div class="stat-number">642</div>
            <div class="stat-label">Following</div>
          </div>
        </div>

        <div class="actions">
          <button class="follow" onclick="followUser()">Follow</button>

          <button class="message">Message</button>
        </div>

        <div class="footer">Follow along for more ✦</div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-container">
        <p>&copy; <span id="current-year"></span> UI Library</p>
        <p>Open source UI for developers.</p>
      </div>
    </footer>

    <script>
      function followUser() {
        const button = document.querySelector(".follow");

        if (button.textContent === "Follow") {
          button.textContent = "Following";
        } else {
          button.textContent = "Follow";
        }
      }
    </script>
  </body>
</html>
